[package]
name = "prueba_axum_reqwest_anvil"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version="1.53.2",features = ["rt-multi-thread"]}
axum = "0.8.9"
dotenvy = "0.15.7"
serde = {version = "1.0.229", features=["derive"]}
serde_json={version="1.0.151"}
chrono = {version = "0.4.45", features=["serde"]}
reqwest = { version = "0.13.5", features = ["json"] }
rust_decimal = {version = "1.43.0", features = ["serde-float", "macros","maths"]}

log="0.4.34"

aes-gcm = "0.11.1"
base64 = "0.23.1"
sha3 = "0.12.0"
rand = "0.10.3"

tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter","fmt","time","chrono"]}
tracing-log = "0.2.0"
tracing-appender = "0.2.5"